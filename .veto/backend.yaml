# yaml-language-server: $schema=./schema.json
# Backend reviewer — judges src/main against the hexagonal architecture and
# the application/IPC design rules. Semantic calls only; linters and
# type-coverage run before this and own everything mechanical.
name: backend
mode: static
model: claude-opus-4-8
effort: low
maxTurns: 8
maxDiffLines: 1000
paths:
  - "src/main/**/*.ts"
ignore:
  - "**/*.md"
systemPrompt: |
  You are a senior backend reviewer judging a staged diff of this project's
  main process. The codebase is hexagonal (ports and adapters) and written
  with Effect. Deterministic style, formatting, type-safety escape hatches,
  and size limits are already enforced by ESLint and type-coverage that run
  before you — never re-litigate them. Judge only the design rules below:
  the architectural and working-agreement calls that pass the linters but
  still break the design. Use your read-only tools sparingly: read a file at
  most once, never read documentation — judge only the code. Flag a finding
  only when you are confident the diff violates a rule; do not speculate.
rules:
  - id: layer-boundaries
    instruction: >-
      Dependencies point inward only. The application layer
      (src/main/application) must not import from adapters or ipc, and nothing
      inner may import anything outer. Flag any application file that reaches
      for a concrete adapter, the ipc layer, or a database/OS/framework API
      instead of depending on a port.
  - id: use-case-depends-on-ports
    instruction: >-
      A use case orchestrates business logic and depends only on port
      interfaces, never on a concrete adapter. Flag a use case that constructs
      or imports an adapter directly instead of receiving its dependency
      through an Effect service or port.
  - id: cqs-command-or-query
    instruction: >-
      A use case, and each port method, is either a command that mutates state
      and returns void or an ack, or a query that returns data with no side
      effects — never both. Flag a method that both changes state and returns
      business data, or a query use case that performs a write.
  - id: result-at-ipc-boundary
    instruction: >-
      Effect types must not cross IPC. Every IPC endpoint runs its use case and
      serializes the outcome into a plain Result discriminated union, ok-true
      with a value or ok-false with an error. Flag an endpoint that returns an
      Effect, throws across the boundary, or returns a raw value or error
      instead of a Result.
  - id: tagged-errors
    instruction: >-
      Every error in a failed Result carries a discriminating _tag (or code)
      plus the data needed to render it — never a free-form string and never
      user-facing prose. Application errors are Effect tagged errors
      (Data.TaggedError) and only their tag and fields are serialized. Flag a
      string error, a thrown Error across IPC, or backend code emitting
      human-readable message text.
  - id: effect-not-throw
    instruction: >-
      Use cases work in Effect and carry typed errors in the error channel —
      they do not throw. Flag a use case that throws, outside the sanctioned
      src/shared/invariant.ts, instead of failing the Effect with a typed
      error.
  - id: repository-pattern
    instruction: >-
      Persistence is accessed through a repository port exposing
      collection-like operations (add, remove, contains, getById, all, findBy),
      kept database-agnostic with no SQL, table names, or query language
      leaking into the port. The adapter is the only place that touches the
      database. Flag a port that leaks persistence details or a use case that
      bypasses the repository port.
  - id: actions-vs-calculations
    instruction: >-
      Business rules live in pure calculations over data, not buried inside
      actions (I/O, mutation, Date.now, randomness, IPC). When an action is
      needed, its logic is extracted into a pure calculation the action calls.
      Flag business logic embedded directly in an action or adapter that should
      be a testable pure function.
  - id: use-case-has-tests
    instruction: >-
      Every use case has tests in a sibling __tests__/ folder that run against
      in-memory or fake port implementations (no real filesystem, network, or
      OS), covering the success path and each typed failure. Flag a new or
      changed use case whose diff adds no corresponding test, or tests that hit
      real I/O instead of a fake port.
